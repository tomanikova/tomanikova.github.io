<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web sa pripravuje</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f5f1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      max-width: 680px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.6;
      color: #455066;
    }
  </style>
</head>
<body>
  <main>
    <h1>Web sa pripravuje</h1>
    <p>Pracujeme na spustení stránky.</p>
  </main>
</body>
</html>
